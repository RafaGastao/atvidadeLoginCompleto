spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: login-seguro
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:login_seguro}
  session:
    timeout: 30m
    mongodb:
      collection-name: sessions
  thymeleaf:
    cache: false

server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_SESSION_COOKIE_SECURE:false}
        same-site: lax
        name: LOGINSEGUROSESSION

