<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(~{::title})}"><title>Entrar · Conecta Saúde</title></head>
<body>
<main th:replace="~{fragments/layout :: shell(~{::section}, 'login')}">
<section>
    <div class="alert error" role="alert" th:if="${param.error}">E-mail ou senha inválidos. Tente novamente.</div>
    <div class="alert success" role="status" th:if="${param.registered}">Conta criada! Entre com seu e-mail e senha.</div>
    <div class="alert success" role="status" th:if="${param.logout}">Você saiu da sua conta.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">E-mail</label>
        <input id="username" name="username" type="email" autocomplete="username" placeholder="Digite seu e-mail" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        <button type="submit">Entrar</button>
    </form>
    <p class="switch">Não tem uma conta? <a th:href="@{/cadastro}">Cadastrar</a></p>
</section>
</main>
</body>
</html>
